<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="header grid-item"></div>

        <div class="sidebar grid-item">
            <div class="heading side-content">
                <svg viewBox="0 0 24 24">
                    <path d="M13,3V9H21V3M13,21H21V11H13M3,21H11V15H3M3,13H11V3H3V13Z"/>
                </svg>
                Dashboard
            </div>
            <div class="page-link side-content">
                <ul class="page-list">
                    <li class="list-item-1">Home</li>
                    <li class="list-item-2">Profile</li>
                    <li class="list-item-3">Messages</li>
                    <li class="list-item-4">History</li>
                    <li class="list-item-5">Tasks</li>
                    <li class="list-item-6">Communities</li>
                </ul>
            </div>
            <div class="setting-link side-content">
                <ul class="setting-list">
                    <li class="list-item-1">Settings</li>
                    <li class="list-item-2">Support</li>
                    <li class="list-item-3">Privacy</li>
                </ul>
            </div>
        </div>

        <div class="main-content grid-item"></div>
    </div>
</body>
</html>
